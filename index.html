<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1256a0">
  <meta name="description" content="Díszkertek munkabér- és keretnyilvántartó alkalmazás.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="hu_HU">
  <meta property="og:title" content="Díszkertek Munkabér">
  <meta property="og:description" content="Heti munkabér, kassza, munkaruha és téli pénz áttekintése.">
  <meta property="og:url" content="https://agnesgeller.github.io/bootcamp-FREEE-munkaber/">
  <meta property="og:image" content="https://agnesgeller.github.io/bootcamp-FREEE-munkaber/assets/forint-icon.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Díszkertek Munkabér">
  <meta name="twitter:description" content="Heti munkabér, kassza, munkaruha és téli pénz áttekintése.">
  <meta name="twitter:image" content="https://agnesgeller.github.io/bootcamp-FREEE-munkaber/assets/forint-icon.png">
  <link rel="icon" href="assets/forint-icon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/forint-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css?v=19">
  <title>Munkabér – Díszkertek</title>
</head>
<body>
  <section id="loginView" class="login-view">
    <form id="loginForm" class="login-card">
      <img src="assets/diszkertek-logo.png" alt="Díszkertek"><img class="login-coin" src="assets/forint-icon.png" alt="">
      <h1>Munkabér</h1>
      <label>Név<select name="manager" required><option value="">Válassz…</option><option value="Tamás">Tamás</option><option value="Ági">Ági</option></select></label>
      <label id="pinLabel">PIN-kód<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="current-password" required></label>
      <button class="button primary" type="submit">Belépés</button><p id="loginStatus" class="login-status" role="status"></p>
    </form>
  </section>
  <div id="appShell" hidden>
  <header class="topbar">
    <a class="brand" href="#top" aria-label="Díszkertek Munkabér kezdőlap"><img src="assets/diszkertek-logo.png" alt="Díszkertek"><span>Munkabér</span></a>
    <nav aria-label="Fő navigáció">
      <button class="nav-button active" data-view="attendance" type="button">Jelenléti ív</button>
      <button class="nav-button" data-view="payroll" type="button">Heti bérek</button>
      <button class="nav-button" data-view="employees" type="button">Dolgozók</button>
      <button class="nav-button" data-view="funds" type="button">Havi keretek</button>
      <button id="logoutButton" class="nav-button logout" type="button">Kilépés</button>
    </nav>
    <div class="cloud-tools"><button id="installButton" class="install-button" type="button">↓ Letöltés</button><button id="refreshButton" class="refresh-button" type="button">↻ Frissítés</button></div>
  </header>

  <main id="top" class="page">
    <section class="page-head">
      <div><p class="eyebrow">DÍSZKERTEK</p><h1>Munkabér</h1></div>
      <img class="coin" src="assets/forint-icon.png" alt="Mosolygó 100 forintos">
    </section>

    <section id="attendanceView" class="view">
      <div class="section-title"><h2>Jelenléti ív</h2></div>
      <div class="attendance-layout">
        <form id="attendanceForm" class="attendance-form">
          <label>Dátum<input id="attendanceDate" name="date" type="date" required></label>
          <details class="employee-picker"><summary id="employeePickerSummary">Dolgozók kiválasztása</summary><div id="attendanceEmployees"></div></details>
          <label>Gyors művelet<select id="attendanceAction" name="action" required><option value="">Válassz eseményt…</option><option value="absence">Nem dolgozott (−1 nap)</option><option value="halfday">Fél nap (−1 nap + órák)</option><option value="paid-leave">Fizetett szabadság</option><option value="unpaid-leave">Fizetetlen szabadnap (−1 nap)</option><option value="rain">Esős nap (−1 nap)</option><option value="extra-day">Plusz munkanap (+1 nap)</option><option value="saturday">Szombati munkanap (+1 nap)</option><option value="hours">Normál munkaóra</option><option value="overtime">Túlóra</option><option value="bonus">Bónusz</option><option value="trip">Fuvar</option><option value="advance">Előleg</option><option value="loan">Kölcsön</option><option value="repayment">Törlesztés</option><option value="payback">Visszafizetés</option><option value="other-income">Egyéb bevétel</option><option value="other-deduction">Egyéb levonás</option><option value="custom">Egyedi esemény</option></select></label>
          <div id="quantityField" class="event-field" hidden><label id="quantityLabel">Mennyiség<input name="quantity" type="number" step="0.5" min="0"></label></div>
          <div id="amountField" class="event-field" hidden><label>Összeg (Ft)<input name="amount" type="number" step="100" min="0"></label></div>
          <div id="labelField" class="event-field" hidden><label>Megnevezés<input name="label" maxlength="100"></label></div>
          <div id="customFields" class="custom-fields" hidden><label>Napkorrekció<input name="dayDelta" type="number" step="0.5"></label><label>Normál óra<input name="normalHours" type="number" step="0.5" min="0"></label><label>Túlóra<input name="overtimeHours" type="number" step="0.5" min="0"></label><label>Összeg típusa<select name="amountDirection"><option value="income">Bevétel</option><option value="deduction">Levonás</option></select></label></div>
          <label>Megjegyzés <small>(nem kötelező)</small><textarea name="note" rows="2" maxlength="300"></textarea></label>
          <div id="attendancePreview" class="event-preview">Válassz dolgozót és eseményt.</div>
          <button class="button primary" type="submit">Esemény rögzítése</button>
        </form>
        <section class="daily-log"><div class="daily-log-head"><div><small>KIVÁLASZTOTT NAP</small><h3 id="dailyLogDate"></h3></div><div class="daily-log-actions"><strong id="dailyEventCount">0 esemény</strong><button id="deleteSelectedEvents" class="delete-selected-events" type="button" disabled hidden>Kijelöltek törlése</button><button id="deleteDailyEvents" class="delete-all-events" type="button" hidden>Összes törlése</button></div></div><div id="dailyEvents" class="daily-events"></div></section>
      </div>
    </section>

    <section id="payrollView" class="view" hidden>
      <div class="week-nav" aria-label="Elszámolási hét kiválasztása">
        <button id="previousWeek" class="button secondary" type="button">← Előző hét</button>
        <div><small>Elszámolási időszak</small><strong id="weekRange"></strong><span id="payday"></span></div>
        <button id="nextWeek" class="button secondary" type="button">Következő hét →</button>
      </div>
      <div class="print-toolbar">
        <label><input id="selectAllCards" type="checkbox"> Mind kijelölése</label>
        <span id="selectedCount">0 bérlap kijelölve</span>
        <button id="printSelected" class="button secondary" type="button" disabled>Kijelöltek nyomtatása</button>
        <button id="printAll" class="button primary" type="button">Összes nyomtatása A4-en</button>
        <button class="button secondary" data-download-payroll="week" type="button">Heti letöltés</button>
        <button class="button secondary" data-download-payroll="month" type="button">Havi letöltés</button>
        <button class="button secondary" data-download-payroll="year" type="button">Éves letöltés</button>
      </div>
      <div id="employeeCards" class="employee-list"></div>
      <section class="totals" aria-labelledby="totalsTitle"><h2 id="totalsTitle">Heti összesítő</h2><div id="weeklyTotals" class="totals-grid"></div></section>
    </section>

    <section id="employeesView" class="view" hidden>
      <div class="section-title"><h2>Dolgozók</h2><button id="addEmployee" class="button primary" type="button">+ Új dolgozó</button></div>
      <div id="employeeSettings" class="settings-list"></div>
    </section>

    <section id="fundsView" class="view" hidden>
      <div class="section-title"><h2>Munkaruha és téli pénz</h2></div>
      <div id="fundCards" class="fund-list"></div>
    </section>
  </main>
  </div>

  <dialog id="employeeDialog"><form id="employeeForm" method="dialog"><div class="dialog-head"><h2>Dolgozó adatai</h2><button class="icon-button" value="cancel" aria-label="Bezárás">×</button></div><input name="id" type="hidden"><div class="form-grid"><label>Név<input name="name" required></label><label>Napibér (Ft)<input name="dailyRate" type="number" min="0" step="100" required></label><label>Órabér (Ft)<input name="hourlyRate" type="number" min="0" step="100" required></label><label>Túlóradíj (Ft/óra)<input name="overtimeRate" type="number" min="0" step="100" required></label><label>Éves szabadságkeret (nap)<input name="vacationAllowance" type="number" min="0" step="0.5" required></label><label>Munkaruha havi keret (Ft)<input name="workwearMonthly" type="number" min="0" step="1000"></label><label>Téli pénz havi keret (Ft)<input name="winterMonthly" type="number" min="0" step="1000"></label><label class="check"><input name="cashier" type="checkbox"> Kasszával rendelkezik</label></div><div class="dialog-actions"><button class="button secondary" value="cancel">Mégse</button><button class="button primary" value="save">Mentés</button></div></form></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="js/supabase-config.js?v=13"></script>
  <script src="js/storage.js?v=19"></script>
  <script src="js/login.js?v=18"></script>
  <script src="js/app.js?v=17"></script>
  <script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js"));}</script>
</body>
</html>
